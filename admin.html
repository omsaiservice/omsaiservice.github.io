<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Om Sai Admin</title>
<style>
:root{--bg:#121212;--card:#1b1f27;--ink:#eef1f7;--muted:#aab3c5;--line:#343a47;--or:#ff6a00;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
h1{margin:0;font-size:1.15rem}h1 span{color:var(--or)}
main{max-width:560px;margin:0 auto;padding:16px}
input{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#171b22;color:var(--ink);font:inherit}
button,a.b{border:0;border-radius:99px;min-height:40px;padding:0 16px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;background:#2a303c;color:var(--ink)}
.p{background:var(--or);color:#fff}.g{background:#15803d}.r{background:#7f1d1d}.w{background:#25d366;color:#08331a}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs .on{background:var(--or)}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.top b{font-size:1.02rem}
.price{color:var(--or);font-weight:800;white-space:nowrap}
.m{color:var(--muted);font-size:.85rem;margin-top:4px}
.st{display:inline-block;border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:800;margin-left:6px}
.Pending{background:#5c4208;color:#ffd277}.Done{background:#12301e;color:#7ee2a0}.Cancelled{background:#3a1616;color:#ff9a92}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.err{color:#ff8f86;font-size:.85rem;margin-top:6px;min-height:1.2em}.hide{display:none!important}
</style>
</head>
<body>
<header><h1><span>Om Sai</span> Admin</h1><button id="out" class="hide">Logout</button></header>
<main>
 <div id="login" style="display:grid;gap:10px;margin-top:30px">
  <b>Admin Password</b>
  <input id="pw" type="password" placeholder="Password likhein" autocomplete="current-password">
  <button class="p" id="go" style="min-height:48px">Andar jayein</button>
  <div class="err" id="le"></div>
 </div>
 <div id="app" class="hide">
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <div class="m" id="info"></div>
 </div>
</main>
<script>
// Yahan Apps Script ka Web App URL paste karein
var ENDPOINT="https://script.google.com/macros/s/AKfycbz7wnl9j9CHz9m4wzBozdHoeH-7jA889j-FfwKTmHuez1zWG8BixxHdyVu7rdciI-vxSg/exec";
var $=function(i){return document.getElementById(i)},pw="",rows=[],tab="Pending",timer;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(b){b.password=pw;return fetch(ENDPOINT,{method:"POST",body:JSON.stringify(b)}).then(function(r){return r.json()})}
function load(){
 if(!ENDPOINT){$('le').textContent="ENDPOINT set nahi hai. File me Apps Script URL paste karein.";return Promise.resolve()}
 return api({action:"list"}).then(function(r){
  if(!r.ok){logout();$('le').textContent=r.error==="password"?"Password galat hai.":"Kuch gadbad hui.";return}
  rows=r.rows;$('login').classList.add("hide");$('app').classList.remove("hide");$('out').classList.remove("hide");draw();
  $('info').textContent="Aakhri update: "+new Date().toLocaleTimeString("en-IN")+" • har 30 second me apne aap badlega";
 }).catch(function(){$('le').textContent="Internet ya URL me dikkat hai.";$('info').textContent="Update nahi ho paaya, internet check karein."});
}
function draw(){
 var n={All:rows.length,Pending:0,Done:0,Cancelled:0};rows.forEach(function(r){if(n[r[12]]!=null)n[r[12]]++});
 $('tabs').innerHTML=["Pending","Done","Cancelled","All"].map(function(t){return '<button data-t="'+t+'" class="'+(t===tab?"on":"")+'">'+t+' ('+n[t]+')</button>'}).join("");
 var l=rows.filter(function(r){return tab==="All"||r[12]===tab});
 $('list').innerHTML=l.length?l.map(function(r){
  var ph=String(r[3]).replace(/\D/g,"").slice(-10),loc=String(r[11]||""),t=new Date(r[1]);
  return '<div class="c"><div class="top"><div><b>'+esc(r[2])+'</b><span class="st '+esc(r[12])+'">'+esc(r[12])+'</span></div><div class="price">'+esc(r[7])+'</div></div>'
  +'<div class="m">'+esc(r[5])+(r[6]&&r[6]!=="N/A"?" • "+esc(r[6]):"")+" • "+esc(r[4])+'</div>'
  +'<div class="m">📅 '+esc(r[8])+" • "+esc(r[9])+'</div>'
  +(r[10]?'<div class="m">🏠 '+esc(r[10])+'</div>':'')
  +'<div class="m">Booking: '+(isNaN(t)?"":t.toLocaleString("en-IN"))+'</div>'
  +'<div class="row"><a class="b p" href="tel:'+ph+'">📞 Call</a><a class="b w" target="_blank" rel="noopener" href="https://wa.me/91'+ph+'">💬 WhatsApp</a>'
  +(/^https?:\/\//.test(loc)?'<a class="b" target="_blank" rel="noopener" href="'+esc(loc)+'">📍 Map</a>':'')+'</div>'
  +'<div class="row">'+(r[12]!=="Done"?'<button class="g" data-s="Done" data-id="'+esc(r[0])+'">✔ Done</button>':'')+(r[12]!=="Cancelled"?'<button class="r" data-s="Cancelled" data-id="'+esc(r[0])+'">✖ Cancel</button>':'')+(r[12]!=="Pending"?'<button data-s="Pending" data-id="'+esc(r[0])+'">↩ Pending</button>':'')+'</div></div>'
 }).join(""):'<div class="m">Is section me abhi koi booking nahi.</div>';
}
$('tabs').addEventListener("click",function(e){var t=e.target.dataset.t;if(t){tab=t;draw()}});
$('list').addEventListener("click",function(e){
 var b=e.target.closest("button[data-s]");if(!b)return;
 b.disabled=true;api({action:"status",id:b.dataset.id,status:b.dataset.s}).then(load).catch(function(){b.disabled=false;$('info').textContent="Status badal nahi paaya."});
});
function login(){pw=$('pw').value;if(!pw)return;$('le').textContent="";try{sessionStorage.setItem("omsai_pw",pw)}catch(e){}load().then(function(){clearInterval(timer);timer=setInterval(load,30000)})}
function logout(){pw="";clearInterval(timer);try{sessionStorage.removeItem("omsai_pw")}catch(e){}$('app').classList.add("hide");$('out').classList.add("hide");$('login').classList.remove("hide");$('pw').value=""}
$('go').onclick=login;$('pw').addEventListener("keydown",function(e){if(e.key==="Enter")login()});$('out').onclick=logout;
try{var sp=sessionStorage.getItem("omsai_pw");if(sp){$('pw').value=sp;login()}}catch(e){}
</script>
</body>
</html>
